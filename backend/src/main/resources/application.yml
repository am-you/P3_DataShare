spring:
  application:
    name: datashare-backend
  # Am.Yo : lit backend/.env, jamais versionné
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:datashare}
    username: ${DB_USER:datashare}
    password: ${DB_PASSWORD}
  # Am.Yo : le schéma vient de Flyway, Hibernate vérifie seulement
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Am.Yo : 1 Go maximum par fichier (US01)
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

datashare:
  storage:
    path: ${STORAGE_PATH:./data/uploads}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  front-url: ${FRONT_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
