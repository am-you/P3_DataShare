# Am.Yo : base PostgreSQL du projet, lancée par scripts/setup-db.sh
services:
  postgres:
    image: postgres:16-alpine
    container_name: datashare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-datashare}
      POSTGRES_USER: ${DB_USER:-datashare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans backend/.env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - datashare-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datashare-pgdata:
